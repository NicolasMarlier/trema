services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-0}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      - db
  db:
    image: postgres:18
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    expose:
      - "5432"
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/postgresql
      - /db_dumps:/db_dumps

volumes:
  db_data: