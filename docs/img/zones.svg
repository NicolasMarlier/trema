<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui,sans-serif" font-size="13">
<title>Trema : où vit chaque élément</title>
<rect x="10" y="10" width="270" height="450" rx="10" fill="#eef4ff" stroke="#3b6fd4"/>
<text x="25" y="35" font-weight="700" fill="#1d4ba0">Poste local</text>
<g fill="#fff" stroke="#3b6fd4"><rect x="25" y="50" width="240" height="50" rx="6"/><rect x="25" y="110" width="240" height="50" rx="6"/><rect x="25" y="170" width="240" height="50" rx="6"/><rect x="25" y="230" width="240" height="50" rx="6"/></g>
<text x="35" y="70">CLI trema (bin/trema)</text><text x="35" y="88" fill="#555">+ hooks/, server/, ui/, templates (source)</text>
<text x="35" y="130">~/.trema_config</text><text x="35" y="148" fill="#555">hôte + utilisateur par défaut</text>
<text x="35" y="190">trema.env (dans chaque projet)</text><text x="35" y="208" fill="#555">hôte, utilisateur, nom de l'app</text>
<text x="35" y="250">remote git « trema »</text><text x="35" y="268" fill="#555">user@hôte:repos/&lt;app&gt;</text>

<rect x="310" y="10" width="280" height="450" rx="10" fill="#fff4e5" stroke="#d98a1c"/>
<text x="325" y="35" font-weight="700" fill="#9a5b00">VM — partagé par toutes les apps</text>
<g fill="#fff" stroke="#d98a1c"><rect x="325" y="50" width="250" height="50" rx="6"/><rect x="325" y="110" width="250" height="50" rx="6"/><rect x="325" y="170" width="250" height="50" rx="6"/><rect x="325" y="230" width="250" height="50" rx="6"/><rect x="325" y="290" width="250" height="50" rx="6"/><rect x="325" y="350" width="250" height="50" rx="6"/></g>
<text x="335" y="70">nginx + certbot</text><text x="335" y="88" fill="#555">/etc/nginx/sites-enabled/*</text>
<text x="335" y="130">Docker (daemon.json)</text><text x="335" y="148" fill="#555">rotation des logs (server:setup)</text>
<text x="335" y="190">~/docker_compose_files/</text><text x="335" y="208" fill="#555">Dockerfile + compose Rails/Postgres</text>
<text x="335" y="250">/db_dumps + cron de purge</text><text x="335" y="268" fill="#555">trema-prune-dumps, 03:00</text>
<text x="335" y="310">~/trema-ui/ + service systemd</text><text x="335" y="328" fill="#555">127.0.0.1:4000, auth.json, audit.log</text>
<text x="335" y="370">vhost trema.&lt;hôte&gt;</text><text x="335" y="388" fill="#555">HTTPS, mot de passe + TOTP</text>

<rect x="620" y="10" width="270" height="450" rx="10" fill="#eaf8ee" stroke="#2f9e55"/>
<text x="635" y="35" font-weight="700" fill="#1b6b38">VM — une copie par app</text>
<g fill="#fff" stroke="#2f9e55"><rect x="635" y="50" width="240" height="50" rx="6"/><rect x="635" y="110" width="240" height="50" rx="6"/><rect x="635" y="170" width="240" height="50" rx="6"/><rect x="635" y="230" width="240" height="50" rx="6"/><rect x="635" y="290" width="240" height="50" rx="6"/><rect x="635" y="350" width="240" height="50" rx="6"/></g>
<text x="645" y="70">repos/&lt;app&gt; (dépôt nu)</text><text x="645" y="88" fill="#555">reçoit git push</text>
<text x="645" y="130">repos/&lt;app&gt;/hooks/post-receive</text><text x="645" y="148" fill="#c0392b">copie de hooks/ (peut être en retard)</text>
<text x="645" y="190">apps/&lt;app&gt;/ (worktree)</text><text x="645" y="208" fill="#555">code + Dockerfile/compose copiés</text>
<text x="645" y="250">apps/&lt;app&gt;/.env</text><text x="645" y="268" fill="#555">secrets, WEB_PORT (édité via env)</text>
<text x="645" y="310">conteneurs &lt;app&gt;-web-1, -db-1</text><text x="645" y="328" fill="#555">+ volume db_data</text>
<text x="645" y="370">sites-enabled/&lt;sous-domaine&gt;</text><text x="645" y="388" fill="#555">+ deploys.log dans apps/&lt;app&gt;</text>
</svg>
