<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trema</title>
<style>
:root{--bg:#fff;--fg:#1a1d24;--mut:#6b7280;--card:#f4f5f8;--ok:#16a34a;--ko:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#14161b;--fg:#e8eaf0;--mut:#9aa1b0;--card:#1e2128}}
body{font:14px system-ui;background:var(--bg);color:var(--fg);margin:0;display:flex;min-height:100vh}
nav{width:220px;background:var(--card);padding:12px}nav button{display:block;width:100%;text-align:left;margin:2px 0}
main{flex:1;padding:16px}pre{background:var(--card);padding:8px;max-height:300px;overflow:auto}
.up{color:var(--ok)}.down{color:var(--ko)}input{margin:2px}
</style></head><body>
<nav><h3>Trema</h3><div id="apps"></div><div id="who"></div></nav>
<main id="main">Choisissez une app.</main>
<script>
const $=s=>document.querySelector(s);let es;
const api=(p,o)=>fetch('/api/'+p,o&&o.method?{...o,headers:{'content-type':'application/json','x-trema':'1'}}:o).then(r=>r.json());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
api('me').then(m=>{if(m.public){$('#who').innerHTML='<button id="logout">Déconnexion</button>';$('#logout').onclick=async()=>{await api('logout',{method:'POST',body:'{}'});location.reload();};}}).catch(()=>{});
async function load(){const a=await api('apps');$('#apps').innerHTML=a.map(x=>`<button data-n="${esc(x.name)}"><span class="${x.status}">●</span> ${esc(x.name)}</button>`).join('');
 document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>show(b.dataset.n));}
async function show(n){if(es)es.close();
 const [env,dep,st]=await Promise.all([api(`apps/${n}/env`),api(`apps/${n}/deploys`),api(`apps/${n}/stats`)]);
 $('#main').innerHTML=`<h2>${esc(n)}</h2>
 <p>${st.map(s=>esc(s.name)+' — CPU '+esc(s.cpu)+' · '+esc(s.mem)).join('<br>')}</p>
 <button onclick="act('${n}','restart')">Redémarrer</button> <button onclick="act('${n}','stop')">Arrêter</button> <button onclick="act('${n}','start')">Démarrer</button>
 <h3>Variables d'env</h3><div id="env">${env.map(e=>`<div><input class="k" value="${esc(e.key)}"> <input class="v" type="password" value="${esc(e.value)}"> <button onclick="const i=this.previousElementSibling;i.type=i.type=='password'?'text':'password'">👁</button></div>`).join('')}</div>
 <button onclick="addVar()">+ variable</button> <button onclick="saveEnv('${n}')">Enregistrer et redéployer</button>
 <h3>Déploiements</h3><ul>${dep.map(d=>`<li>${esc(d.date)} ${esc(d.commit)} ${d.duration}s <b class="${d.result=='ok'?'up':'down'}">${esc(d.result)}</b></li>`).join('')||'<li>Aucun</li>'}</ul>
 <h3>Logs</h3><pre id="logs"></pre>`;
 es=new EventSource(`/api/apps/${n}/logs`);es.onmessage=e=>{const l=$('#logs');l.textContent+=e.data+'\n';l.scrollTop=l.scrollHeight};}
function addVar(){$('#env').insertAdjacentHTML('beforeend','<div><input class="k"> <input class="v" type="password"></div>')}
async function saveEnv(n){const body=[...document.querySelectorAll('#env div')].map(d=>({key:d.querySelector('.k').value,value:d.querySelector('.v').value})).filter(e=>e.key);
 const r=await api(`apps/${n}/env`,{method:'PUT',body:JSON.stringify(body)});alert(r.error||'Redéployé');}
async function act(n,a){await api(`apps/${n}/${a}`,{method:'POST',body:'{}'});load();}
load();
</script></body></html>
