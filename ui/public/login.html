<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trema – Connexion</title>
<style>
:root{--bg:#fff;--fg:#1a1d24;--mut:#6b7280;--card:#f4f5f8;--ko:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#14161b;--fg:#e8eaf0;--mut:#9aa1b0;--card:#1e2128}}
body{font:14px system-ui;background:var(--bg);color:var(--fg);margin:0;display:flex;min-height:100vh}
form{margin:auto;width:300px;background:var(--card);padding:22px;border-radius:12px}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:12px}
input,button{font:inherit;width:100%;box-sizing:border-box;padding:8px}button{margin-top:14px}
#err{color:var(--ko);min-height:18px;margin-top:8px}
</style></head><body>
<form id="f"><h3>▲ Trema</h3>
<label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required autofocus>
<label>Code d'authentification (6 chiffres)</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" required>
<button>Se connecter</button><div id="err"></div></form>
<script>
f.onsubmit=async e=>{e.preventDefault();
 const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json','x-trema':'1'},body:JSON.stringify({password:pw.value,code:code.value})});
 const j=await r.json().catch(()=>({}));
 if(r.ok)location.href='/';else err.textContent=j.error||'Erreur';};
</script></body></html>
